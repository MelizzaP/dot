bind r source-file "~/.tmux.conf" \; display "󰑓 TMUX conf reloaded 󰑓"
bind C-a send-prefix
# split windows like vim
# vim's definition of a horizontal/vertical split is reversed from tmux's
bind s split-window -v
bind v split-window -h

# move around panes with hjkl, as one would in vim after pressing ctrl-w
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# resize panes like vim
# feel free to change the "1" to however many lines you want to resize by, only
# one at a time can be slow
bind < resize-pane -L 5
bind > resize-pane -R 5
bind - resize-pane -D 5
bind + resize-pane -U 5

# bind : to command-prompt like vim
# this is the default in tmux already
bind : command-prompt

# fzf pickers in a floating popup
bind S display-popup -E -w 60% -h 40% 'tmux list-sessions -F "#{session_name}" | fzf --reverse --prompt="session > " | xargs -I{} tmux switch-client -t {}'
bind W display-popup -E -w 70% -h 50% 'tmux list-windows -a -F "#{session_name}:#{window_index} #{window_name}" | fzf --reverse --prompt="window > " | cut -d" " -f1 | xargs -I{} tmux switch-client -t {}'
bind N display-popup -E -w 60% -h 40% '~/.dot/bin/tmux-alerts'

# unbind C-b
set -g prefix C-a

set -g base-index 1
set -g pane-base-index 1

set -s escape-time 0
# vi-style controls for copy mode
setw -g mode-keys vi

# set -g @plugin 'tmux-plugins/tpm'
# run '~/.tmux/plugins/tpm/tpm'

set -g mouse on
set -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",xterm-256color:RGB"

set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
set -g bell-action other
set -g display-time 1000

set-hook -g after-select-window 'set-option -w -u @claude'
set-hook -g session-window-changed 'set-option -w -u @claude'

# clock mode
setw -g clock-mode-colour '#dbbc7f'

# copy mode
setw -g mode-style 'fg=#2d353b bg=#dbbc7f bold'

# panes
set -g pane-border-style 'fg=#475258'
set -g pane-active-border-style 'fg=#a7c080'

# statusbar
set -g status-position top
set -g status-justify left
set -g status-style 'fg=#d3c6aa'
set -g status-interval 2

set -g status-left-style 'fg=magenta bold'
set -g status-left '#S: '
set -g status-left-length 100

set -g status-right-style 'fg=#83c092'
set -g status-right '#(~/.dot/bin/tmux-claude)#[fg=#e67e80,bold]#(~/.dot/bin/tmux-unread)#[default] #[fg=#83c092,bold] 󰨈 #(whoami)#[default]'
set -g status-right-length 100

setw -g window-status-style 'fg=#859289'
setw -g window-status-format '#{?#{m:󰀦*,#{@claude}},#[fg=#dbbc7f bold]#{?window_bell_flag,󰂞 ,}#W,#{?#{m:󰸞*,#{@claude}},#[fg=#a7c080 bold]#{?window_bell_flag,󰂞 ,}#W,#{?window_bell_flag,󰂞 ,}#W}}'

setw -g window-status-current-style 'fg=#d3c6aa bold'
setw -g window-status-current-format '[#W]'

setw -g window-status-bell-style 'fg=#e67e80 bold'
setw -g window-status-activity-style 'fg=#e69875 bold'

set -g message-style 'fg=#dbbc7f bold'

setw -g monitor-bell on

set-option -g default-shell /opt/homebrew/bin/fish
